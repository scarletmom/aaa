<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Quillwood Notes</title>
  <script>
    // Old addresses section.html?c= | ?tag= | ?q= → /section/<slug>/, /topic/<slug>/, /search/?q=, keeping ?token= etc.
    (function () {
      // Same as tagSlug() in src/lib/format.js.
      function tagSlug(tag) {
        return tag.toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/[\s_-]+/g, '-');
      }
      var params = new URLSearchParams(location.search);
      var next = new URLSearchParams();
      var path;
      if (params.has('q')) {
        path = '/search/';
        next.set('q', params.get('q'));
      } else if (params.get('tag')) {
        path = '/topic/' + tagSlug(params.get('tag')) + '/';
      } else {
        path = '/section/' + encodeURIComponent(params.get('c') || 'latest') + '/';
      }
      params.forEach(function (value, key) {
        if (key !== 'c' && key !== 'tag' && key !== 'q') next.append(key, value);
      });
      var rest = next.toString();
      location.replace(path + (rest ? '?' + rest : '') + location.hash);
    })();
  </script>
</head>
<body></body>
</html>
